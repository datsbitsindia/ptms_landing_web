version: '3.8'

services:
  ptms-landing:
    build: .
    container_name: ptms-landing-web
    network_mode: "host"
    environment:
      - PORT=8090
      - DB_HOST=localhost
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=ptms_uno
      - TABLE_PREFIX=uno_
    restart: always
